<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0d10" />
    <title>h3-dispatch · ride dispatch on Uber's H3 grid</title>
    <meta name="description" content="A ride-hailing dispatch simulator on Uber's H3 hexagonal grid: nearest-driver search by expanding rings and surge pricing per cell." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l12 7v14l-12 7-12-7V9z' fill='%23f5b041'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="map" aria-label="Map of the simulation"></div>

    <aside id="panel">
      <header>
        <h1>h3-dispatch</h1>
        <p class="lede">Ride dispatch on Uber's <a href="https://h3geo.org" target="_blank" rel="noreferrer">H3</a> hexagonal grid. Click the map to request a ride and watch the ring search find a driver.</p>
      </header>

      <section class="controls" aria-label="Simulation controls">
        <button id="play" type="button" aria-pressed="true">Pause</button>
        <div class="segmented" role="group" aria-label="Speed">
          <button type="button" data-speed="1" aria-pressed="true">1×</button>
          <button type="button" data-speed="4" aria-pressed="false">4×</button>
          <button type="button" data-speed="16" aria-pressed="false">16×</button>
        </div>
        <label>
          Resolution
          <select id="resolution">
            <option value="7">7 · ~5.2 km²</option>
            <option value="8" selected>8 · ~0.74 km²</option>
            <option value="9">9 · ~0.11 km²</option>
          </select>
        </label>
        <label>
          Drivers <output id="drivers-out">300</output>
          <input id="drivers" type="range" min="30" max="1500" step="10" value="300" />
        </label>
        <label class="check"><input id="grid" type="checkbox" checked /> Show grid</label>
        <button id="restart" type="button" class="ghost">Restart</button>
      </section>

      <section aria-label="Live metrics">
        <h2>City <span id="clock" class="muted">00:00</span></h2>
        <dl class="stats" id="stats"></dl>
      </section>

      <section aria-label="Search efficiency">
        <h2>Search efficiency</h2>
        <p class="efficiency" id="efficiency">Waiting for the first request…</p>
      </section>

      <section aria-label="Last search" id="last" hidden>
        <h2>Your request</h2>
        <dl class="stats" id="last-stats"></dl>
      </section>

      <section class="legend" aria-label="Legend">
        <span><i class="dot idle"></i>Idle driver</span>
        <span><i class="dot enRoute"></i>Going to pickup</span>
        <span><i class="dot onTrip"></i>On a trip</span>
        <span><i class="dot rider"></i>Waiting rider</span>
        <span class="surge-scale"><i></i>Surge 1.1× → 3×</span>
      </section>

      <footer class="muted">
        <a href="https://github.com/Matheuscfs/h3-dispatch" target="_blank" rel="noreferrer">Source on GitHub</a>
      </footer>
    </aside>

    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
